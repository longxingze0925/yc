<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RC 远控 - 登录</title>
    <link rel="stylesheet" href="../_shared/base.css">
  </head>
  <body class="desktop-preview-page">
    <main class="desktop-preview">
      <section class="desktop-app-frame" aria-label="RC 远控 Windows 登录窗口">
        <header class="desktop-titlebar">
          <span class="desktop-platform-mark">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.2 10.3 4v7.2H3V5.2Zm8.3-1.4L21 2.4v8.8h-9.7V3.8ZM3 12.2h7.3V20L3 18.8v-6.6Zm8.3 0H21v9.4l-9.7-1.4v-8Z"/></svg>
            Windows 11
          </span>
          <strong>RC 远控</strong>
          <span class="desktop-window-controls" aria-label="窗口控制">
            <button class="desktop-window-control" type="button" title="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button>
            <button class="desktop-window-control" type="button" title="最大化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14"/></svg></button>
            <button class="desktop-window-control close" type="button" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
          </span>
        </header>

        <div class="desktop-login-body">
          <section class="desktop-login-side">
            <div class="desktop-login-brand">
              <span class="desktop-brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M8 10l2.5 2.5L16 7"/></svg>
              </span>
              <span><strong>RC 远控</strong><span>统一桌面客户端</span></span>
            </div>

            <div class="desktop-login-device">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              <h2>这台电脑也是一台可控设备</h2>
              <p>登录账号后，此设备会自动加入“我的设备”。完成本机权限授权后，可从您的其他设备安全连接。</p>
            </div>

            <div class="desktop-login-meta">
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>端到端加密</span>
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>设备身份保护</span>
            </div>
          </section>

          <section class="desktop-login-main">
            <form class="desktop-login-form" action="home.html">
              <h1>登录您的账号</h1>
              <p>登录后可管理和连接账号下的设备</p>

              <div class="desktop-field">
                <label for="account">邮箱或手机号</label>
                <input id="account" name="account" type="text" value="owner@example.com" autocomplete="username">
              </div>
              <div class="desktop-field desktop-password-field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" value="password123" autocomplete="current-password">
                <button class="desktop-password-toggle" id="toggle-password" type="button" title="显示密码" aria-label="显示密码">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>

              <div class="desktop-login-options">
                <label class="desktop-check"><input type="checkbox" checked>信任此设备 30 天</label>
                <a href="#">忘记密码</a>
              </div>

              <button class="desktop-button primary" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                登录
              </button>
              <div class="desktop-login-divider">或</div>
              <button class="desktop-button" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M18 5l2 2M15 8l2 2"/></svg>
                使用通行密钥
              </button>

              <div class="desktop-login-server">
                <a href="server.html">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
                  配置自建服务器
                </a>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script>
      const togglePassword = document.querySelector('#toggle-password');
      const password = document.querySelector('#password');
      togglePassword.addEventListener('click', () => {
        const visible = password.type === 'text';
        password.type = visible ? 'password' : 'text';
        togglePassword.title = visible ? '显示密码' : '隐藏密码';
        togglePassword.setAttribute('aria-label', togglePassword.title);
      });
    </script>
  </body>
</html>
