<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 远控 Ubuntu 26.04 LTS</title>
  <link rel="stylesheet" href="../_shared/base.css">
</head>
<body class="desktop-preview-page">
  <main class="desktop-preview">
    <section class="desktop-app-frame" aria-label="远控 Ubuntu 登录窗口">
      <header class="desktop-titlebar ubuntu">
        <span class="ubuntu-window-controls" aria-hidden="true"><i></i><i></i><i></i></span>
        <strong>远控</strong>
        <span class="desktop-platform-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h8M8 12h5M8 16h3"/></svg>
          Ubuntu 26.04 LTS
        </span>
      </header>

      <div class="desktop-login-body">
        <section class="desktop-login-side">
          <div class="desktop-login-brand">
            <span class="desktop-brand-mark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="18" height="12" x="3" y="4" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            </span>
            <span>
              <strong>远控</strong>
              <span>统一桌面客户端</span>
            </span>
          </div>

          <div class="desktop-login-device">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect width="18" height="12" x="3" y="4" rx="2"/><path d="M8 20h8M12 16v4"/><path d="m15 9 2 2 4-4"/></svg>
            <h2>这台电脑也是一台远控设备</h2>
            <p>登录账号后，此设备会自动加入“我的设备”。完成系统授权后，可控制其他设备，也可接受远程连接。</p>
          </div>

          <div class="desktop-login-meta">
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-8 8.8C7.5 20.5 4 18 4 13V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/></svg>
              端到端加密
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
              P2P 优先
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v20M2 12h20"/></svg>
              可私有部署
            </span>
          </div>
        </section>

        <section class="desktop-login-main">
          <form class="desktop-login-form" action="home.html">
            <h1>登录账号</h1>
            <p>登录后继续使用你的设备和远程协助。</p>

            <div class="desktop-field">
              <label for="account">账号</label>
              <input id="account" name="account" type="email" value="owner@example.com" autocomplete="username">
            </div>

            <div class="desktop-field desktop-password-field">
              <label for="password">密码</label>
              <input id="password" name="password" type="password" value="password123" autocomplete="current-password">
              <button class="desktop-password-toggle" id="toggle-password" type="button" title="显示密码" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7C3.74 7.6 7.79 5 12 5c4.21 0 8.26 2.6 9.94 6.65a1 1 0 0 1 0 .7C20.26 16.4 16.21 19 12 19c-4.21 0-8.26-2.6-9.94-6.65"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>

            <div class="desktop-login-options">
              <label class="desktop-check"><input type="checkbox" checked> 信任这台设备 30 天</label>
              <a href="#">忘记密码</a>
            </div>

            <button class="desktop-button primary" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
              登录
            </button>

            <div class="desktop-login-divider">或</div>

            <button class="desktop-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>
              使用通行密钥
            </button>

            <div class="desktop-login-server">
              <a href="server.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg>
                配置自建服务器
              </a>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>

  <script>
    const passwordInput = document.querySelector('#password');
    const passwordToggle = document.querySelector('#toggle-password');

    passwordToggle.addEventListener('click', () => {
      const shouldShow = passwordInput.type === 'password';
      passwordInput.type = shouldShow ? 'text' : 'password';
      passwordToggle.title = shouldShow ? '隐藏密码' : '显示密码';
      passwordToggle.setAttribute('aria-label', passwordToggle.title);
    });
  </script>
</body>
</html>
