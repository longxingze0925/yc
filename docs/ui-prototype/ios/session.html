<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>iOS 主控 - 远控会话</title>
  <link rel="stylesheet" href="../_shared/base.css">
</head>
<body class="ios-preview-page">
  <main class="ios-preview">
    <section class="ios-frame ios-session-frame" aria-label="iOS 远控会话页面预览">
      <div class="ios-app">
        <header class="ios-statusbar inverse">
          <span>9:41</span>
          <span class="ios-system-status" aria-label="5G 网络，电量 82%">
            <span class="ios-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>5G</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <span class="ios-battery" aria-hidden="true"></span>
          </span>
        </header>

        <div class="ios-session-screen">
          <header class="ios-session-topbar">
            <a class="ios-back-button" href="mine.html" title="返回设备列表">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <div class="ios-session-device"><strong>办公室 Windows</strong><span>P2P · 端到端加密</span></div>
            <span aria-hidden="true"></span>
          </header>

          <div class="ios-remote-canvas">
            <div class="ios-session-stats"><span>24 ms</span><span>60 fps</span><span>H.264</span></div>
            <div class="ios-remote-desktop" aria-label="远程桌面画面"></div>
          </div>

          <section id="session-actions-panel" class="ios-session-actions" aria-label="会话操作" hidden>
            <header class="ios-actions-header">
              <div class="ios-actions-status">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
                <span><strong>会话保护已开启</strong><small>端到端加密</small></span>
              </div>
              <button id="session-actions-close" class="ios-actions-close" type="button" title="关闭操作面板">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg>
              </button>
            </header>

            <div class="ios-actions-scroll">
              <div class="ios-actions-quick" aria-label="快捷操作">
                <button class="ios-actions-quick-item" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="18" x="5" y="3" rx="2"/><path d="m15 8 3 3-3 3M9 16l-3-3 3-3"/></svg>
                  <span>旋转屏幕</span>
                </button>
                <button class="ios-actions-quick-item active" type="button" aria-pressed="true">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>
                  <span>声音</span>
                </button>
                <button class="ios-actions-quick-item" type="button" aria-pressed="false">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <span>仅观看</span>
                </button>
                <button class="ios-actions-quick-item" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  <span>切换显示器</span>
                </button>
                <button class="ios-actions-quick-item" type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                  <span>适应屏幕</span>
                </button>
              </div>

              <section class="ios-actions-section">
                <h2>控制模式</h2>
                <div class="ios-actions-segmented" role="radiogroup" aria-label="控制模式">
                  <label><input type="radio" name="control-mode" checked><span>屏幕触控</span></label>
                  <label><input type="radio" name="control-mode"><span>鼠标指针</span></label>
                </div>
                <div class="ios-actions-group">
                  <div class="ios-actions-row">
                    <span><strong>按键映射</strong><small>将常用按键固定在远控画面</small></span>
                    <label class="ios-toggle"><input type="checkbox" aria-label="按键映射"><span></span></label>
                  </div>
                </div>
              </section>

              <section class="ios-actions-section">
                <h2>画面质量</h2>
                <div class="ios-actions-quality" role="radiogroup" aria-label="画面质量">
                  <label><input type="radio" name="session-quality" checked><span>均衡</span></label>
                  <label><input type="radio" name="session-quality"><span>文字清晰</span></label>
                  <label><input type="radio" name="session-quality"><span>低延迟</span></label>
                  <label><input type="radio" name="session-quality"><span>低带宽</span></label>
                </div>
                <div class="ios-actions-group">
                  <div class="ios-actions-row">
                    <span><strong>性能数据</strong><small>显示延迟、帧率和编码格式</small></span>
                    <label class="ios-toggle"><input type="checkbox" checked aria-label="性能数据"><span></span></label>
                  </div>
                </div>
              </section>

              <section class="ios-actions-section">
                <h2>会话权限</h2>
                <div class="ios-actions-group">
                  <div class="ios-actions-row"><span><strong>剪贴板同步</strong><small>需要远端授权</small></span><label class="ios-toggle"><input type="checkbox" aria-label="剪贴板同步"><span></span></label></div>
                  <div class="ios-actions-row"><span><strong>文件传输</strong><small>发送文件前由远端确认</small></span><label class="ios-toggle"><input type="checkbox" aria-label="文件传输"><span></span></label></div>
                  <div class="ios-actions-row"><span><strong>隐私屏</strong><small>请求远端隐藏本机画面</small></span><label class="ios-toggle"><input type="checkbox" aria-label="隐私屏"><span></span></label></div>
                  <div class="ios-actions-row"><span><strong>保护远端输入</strong><small>请求暂时阻止远端本地输入</small></span><label class="ios-toggle"><input type="checkbox" aria-label="保护远端输入"><span></span></label></div>
                </div>
              </section>

              <section class="ios-actions-section">
                <h2>设备操作</h2>
                <div class="ios-actions-group">
                  <button class="ios-actions-row command warning" type="button">
                    <span><strong>远程重启</strong><small>需要高风险身份验证</small></span>
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                  </button>
                  <button class="ios-actions-row command danger" type="button"><span><strong>举报并拉黑</strong><small>结束会话并阻止再次连接</small></span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1v11Z"/><path d="M4 22v-7"/></svg></button>
                </div>
              </section>
            </div>
          </section>

          <nav class="ios-session-toolbar" aria-label="会话工具栏">
            <button id="session-desktop-trigger" class="ios-session-tool" type="button" title="显示远端桌面">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="15" x="2" y="3" rx="2"/><path d="M6 7h.01M10 7h.01M14 7h.01M8 22h8M12 18v4"/></svg>
              <span>显示桌面</span>
            </button>
            <button class="ios-session-tool" type="button" title="打开键盘">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M8 13h8"/></svg>
              <span>键盘</span>
            </button>
            <button id="session-actions-trigger" class="ios-session-tool" type="button" title="会话操作" aria-controls="session-actions-panel" aria-expanded="false">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg>
              <span>操作</span>
            </button>
            <a class="ios-session-tool danger" href="mine.html" title="断开会话">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.7 13.8a4 4 0 0 0 5.7 0l2.4-2.4a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M13.3 10.2a4 4 0 0 0-5.7 0l-2.4 2.4a4 4 0 0 0 5.7 5.7l1.4-1.4"/><path d="m4 4 16 16"/></svg>
              <span>断开</span>
            </a>
          </nav>
        </div>
        <div class="ios-home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script>
    const actionsPanel = document.getElementById("session-actions-panel");
    const actionsTrigger = document.getElementById("session-actions-trigger");
    const desktopTrigger = document.getElementById("session-desktop-trigger");
    const closeActions = document.getElementById("session-actions-close");
    const sessionScreen = document.querySelector(".ios-session-screen");

    function setActionsOpen(open) {
      actionsPanel.hidden = !open;
      sessionScreen.classList.toggle("actions-open", open);
      actionsTrigger.classList.toggle("active", open);
      actionsTrigger.setAttribute("aria-expanded", String(open));
      if (!open && location.hash === "#actions") {
        history.replaceState(null, "", location.pathname + location.search);
      }
    }

    actionsTrigger.addEventListener("click", () => setActionsOpen(actionsPanel.hidden));
    desktopTrigger.addEventListener("click", () => setActionsOpen(false));
    closeActions.addEventListener("click", () => setActionsOpen(false));

    document.querySelectorAll(".ios-actions-quick-item[aria-pressed]").forEach((button) => {
      button.addEventListener("click", () => {
        const active = button.getAttribute("aria-pressed") === "true";
        button.setAttribute("aria-pressed", String(!active));
        button.classList.toggle("active", !active);
      });
    });

    if (location.hash === "#actions") setActionsOpen(true);
  </script>
</body>
</html>
