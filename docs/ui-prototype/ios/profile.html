<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>iOS 主控 - 我的</title>
  <link rel="stylesheet" href="../_shared/base.css">
</head>
<body class="ios-preview-page">
  <main class="ios-preview">
    <section class="ios-frame" aria-label="iOS 我的页面预览">
      <div class="ios-app">
        <header class="ios-statusbar">
          <span>9:41</span>
          <span class="ios-system-status" aria-label="5G 网络，电量 82%">
            <span class="ios-signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>5G</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><path d="M12 20h.01"/></svg>
            <span class="ios-battery" aria-hidden="true"></span>
          </span>
        </header>

        <div class="ios-scroll">
          <header class="ios-large-header">
            <div class="ios-header-copy"><span class="ios-eyebrow">账号与设置</span><h1>我的</h1></div>
          </header>

          <a class="ios-panel ios-account-card" href="account.html">
            <span class="ios-account-avatar">LX</span>
            <span>
              <span class="ios-account-name">owner@example.com</span>
              <span class="ios-account-meta">受信任主控设备</span>
            </span>
            <svg class="ios-device-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </a>

          <section class="ios-settings-section">
            <h2>账号</h2>
            <div class="ios-panel ios-settings-list">
              <a class="ios-setting-row" href="account-security.html">
                <span class="ios-setting-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <span><span class="ios-setting-title">账号安全</span><span class="ios-setting-meta">MFA、通行密钥与恢复码</span></span>
                <span class="ios-setting-value"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span>
              </a>
              <a class="ios-setting-row" href="trusted-devices.html">
                <span class="ios-setting-icon green"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="10" x="2" y="3" rx="2"/><rect width="6" height="10" x="16" y="11" rx="2"/></svg></span>
                <span><span class="ios-setting-title">登录设备</span><span class="ios-setting-meta">管理受信任设备</span></span>
                <span class="ios-setting-value">3 台<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span>
              </a>
              <a class="ios-setting-row" href="session-history.html">
                <span class="ios-setting-icon orange"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.1 13a9 9 0 1 0 .5-4.3L3 8"/><path d="M12 7v5l3 2"/></svg></span>
                <span><span class="ios-setting-title">会话记录</span><span class="ios-setting-meta">连接历史与安全审计</span></span>
                <span class="ios-setting-value"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span>
              </a>
            </div>
          </section>

          <section class="ios-settings-section">
            <h2>服务</h2>
            <div class="ios-panel ios-settings-list">
              <a class="ios-setting-row" href="server.html?from=profile">
                <span class="ios-setting-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="7" x="3" y="3" rx="2"/><rect width="18" height="7" x="3" y="14" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg></span>
                <span><span class="ios-setting-title">服务器</span><span class="ios-setting-meta js-service-address">点击配置服务地址</span></span>
                <span class="ios-setting-value"><span class="ios-environment-badge">自建</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span>
              </a>
            </div>
          </section>

          <a class="ios-logout" href="login.html">退出登录</a>
        </div>

        <nav class="ios-tabbar" aria-label="主导航">
          <a class="tab" href="mine.html">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="10" x="2" y="3" rx="2"/><path d="M8 17h4M10 13v4"/><rect width="6" height="10" x="16" y="11" rx="2"/></svg>
            <span>设备</span>
          </a>
          <a class="tab" href="assist.html">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 0 1 16 0"/><path d="M18 19c0 1.1-.9 2-2 2h-3"/><path d="M4 14h3v6H6a2 2 0 0 1-2-2v-4ZM20 14h-3v6h1a2 2 0 0 0 2-2v-4Z"/></svg>
            <span>远程协助</span>
          </a>
          <a class="tab active" href="profile.html" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>我的</span>
          </a>
        </nav>
        <div class="ios-home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script>
    try {
      const savedServer = JSON.parse(localStorage.getItem("remote-server-profile") || "null");
      if (savedServer?.api) document.querySelector(".js-service-address").textContent = savedServer.api;
    } catch (_) {
      localStorage.removeItem("remote-server-profile");
    }
  </script>
</body>
</html>
