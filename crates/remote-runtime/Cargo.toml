[package]
name = "remote-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytes = "1"
remote-core = { path = "../remote-core" }
remote-crypto = { path = "../remote-crypto" }
remote-protocol = { path = "../remote-protocol" }
remote-transport = { path = "../remote-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
uuid = { workspace = true }

[dev-dependencies]
remote-transport = { path = "../remote-transport", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
