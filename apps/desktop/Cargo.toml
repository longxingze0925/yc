[package]
name = "remote-desktop"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Remote Control Project"]
build = "build.rs"

[workspace]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
remote-capture = { path = "../../crates/remote-capture" }
remote-crypto = { path = "../../crates/remote-crypto" }
remote-protocol = { path = "../../crates/remote-protocol" }
remote-render = { path = "../../crates/remote-render" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.17.1", default-features = false, features = ["backend-winit", "compat-1-2", "renderer-software", "std"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[build-dependencies]
slint-build = "1.17.1"

[lints.rust]
# Slint-generated bindings contain scoped `allow(unsafe_code)` annotations.
unsafe_code = "deny"
