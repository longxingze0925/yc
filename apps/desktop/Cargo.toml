[package]
name = "remote-desktop"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Remote Control Project"]
build = "build.rs"

[workspace]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
get_if_addrs = "0.5"
remote-capture = { path = "../../crates/remote-capture" }
remote-codec = { path = "../../crates/remote-codec" }
remote-core = { path = "../../crates/remote-core" }
remote-crypto = { path = "../../crates/remote-crypto" }
remote-protocol = { path = "../../crates/remote-protocol" }
remote-render = { path = "../../crates/remote-render" }
remote-runtime = { path = "../../crates/remote-runtime" }
remote-transport = { path = "../../crates/remote-transport" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.17.1", default-features = false, features = ["backend-winit", "compat-1-2", "renderer-software", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6.1", default-features = false }

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
remote-transport = { path = "../../crates/remote-transport", features = ["test-support"] }

[lints.rust]
# Slint-generated bindings contain scoped `allow(unsafe_code)` annotations.
unsafe_code = "deny"
